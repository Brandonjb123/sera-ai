<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sera AI - Customer Service Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .logo {
      width: 40px;
      height: 40px;
      background: #0ea5e9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
    }
    .chat-header .title {
      font-weight: 600;
      font-size: 16px;
      color: #0f172a;
    }
    .chat-header .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #ffffff;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #0ea5e9;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #f1f5f9;
      color: #0f172a;
      border-bottom-left-radius: 4px;
    }
    .message .source {
      font-size: 11px;
      margin-top: 6px;
      opacity: 0.7;
      color: inherit;
    }
    .chat-input {
      border-top: 1px solid #e2e8f0;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      background: #ffffff;
    }
    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      background: #f8fafc;
    }
    .chat-input input:focus {
      border-color: #0ea5e9;
    }
    .chat-input button {
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-input button:hover {
      background: #0284c7;
    }
    .loading {
      align-self: flex-start;
      font-size: 13px;
      color: #94a3b8;
      padding-left: 4px;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="logo">💬</div>
    <div>
      <div class="title">Sera AI</div>
      <div class="subtitle">Customer Service Demo</div>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()" id="sendButton">Send</button>
</div>
</div>

<script src="strings.js"></script>
<script>
const API_BASE = "https://sera-ai-production-ad38.up.railway.app";

function appendMessage(role, text, sources = []) {
  const container = document.getElementById("chatMessages");
  const msgDiv = document.createElement("div");
  msgDiv.className = `message ${role}`;
  msgDiv.textContent = text;
  if (sources.length > 0) {
    const src = document.createElement("div");
    src.className = "source";
    src.textContent = `Source: ${sources.join(', ')}`;
    msgDiv.appendChild(src);
  }
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  if (!message) return;

  appendMessage("user", message);
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "loading";
  loading.textContent = UI_TEXT.loadingMessage;
  document.getElementById("chatMessages").appendChild(loading);

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    loading.remove();
    appendMessage("assistant", data.response, data.sources || []);
  } catch (err) {
    loading.remove();
    appendMessage("assistant", UI_TEXT.errorMessage);
  }
}
</script>
</body>
</html>
