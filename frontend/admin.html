<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sera AI - Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .admin-container {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .section {
      margin-bottom: 28px;
    }
    .section h2 {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 12px;
    }
    input[type="text"],
    input[type="password"],
    input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
      outline: none;
    }
    input:focus {
      border-color: #0ea5e9;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover {
      background: #0284c7;
    }
    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    button.secondary:hover {
      background: #cbd5e1;
    }
    button.danger {
      background: #ef4444;
    }
    button.danger:hover {
      background: #dc2626;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .message.error {
      background: #fef2f2;
      color: #991b1b;
      display: block;
    }
    .doc-list {
      list-style: none;
      margin-top: 12px;
    }
    .doc-list li {
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .divider {
      border-top: 1px solid #e2e8f0;
      margin: 24px 0;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
      outline: none;
      appearance: auto;
    }
    select:focus {
      border-color: #0ea5e9;
    }
  </style>
</head>
<body>
<div class="admin-container">
  <h1>🛠️ Admin Panel</h1>
  <p class="subtitle">Manage documents for Sera AI Customer Service</p>

  <!-- Login Section -->
  <div class="section" id="loginSection">
    <h2>🔑 Admin Login</h2>
    <input type="text" id="username" placeholder="Username" value="admin">
    <input type="password" id="password" placeholder="Password" value="sera123">
    <button onclick="login()">Login</button>
  </div>

  <!-- Upload Section (hidden until login) -->
  <div class="section" id="uploadSection" style="display:none;">
    <div class="divider"></div>
    <h2>📁 Upload Document</h2>
    <input type="file" id="documentFile" accept=".pdf,.txt">
    <button onclick="uploadDocument()">Upload</button>
    <div class="message" id="uploadMessage"></div>
  </div>

  <!-- BYOK Section (hidden until login) -->
  <div class="section" id="byokSection" style="display:none;">
  <div class="divider"></div>
  <h2>🔑 LLM Configuration (BYOK)</h2>
  <label for="llmProvider">Provider</label>
  <select id="llmProvider" style="width:100%;padding:12px;margin-bottom:12px;border-radius:12px;border:1px solid #e2e8f0;">
    <option value="groq">Groq (Llama 3.3)</option>
    <option value="openai">OpenAI (GPT-4o-mini)</option>
  </select>
  <input type="password" id="llmApiKey" placeholder="Your API Key (encrypted on save)">
  <button onclick="saveByokConfig()">Save Configuration</button>
  <div class="message" id="byokMessage"></div>
</div>


  <!-- Document List Section (hidden until login) -->
  <div class="section" id="docListSection" style="display:none;">
    <h2>📄 Document List</h2>
    <ul class="doc-list" id="docList"></ul>
    <button class="secondary" onclick="loadDocuments()">🔄 Refresh</button>
    <button class="danger" onclick="clearDocuments()" style="margin-top:12px;">🗑️ Delete All</button>
  </div>
</div>

<!-- Load UI text strings -->
<script src="strings.js"></script>
<script>
const API_BASE = "https://sera-ai-production-ad38.up.railway.app";
let authToken = "";

function showMessage(elementId, text, type) {
  const el = document.getElementById(elementId);
  el.textContent = text;
  el.className = `message ${type}`;
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  
  try {
    const res = await fetch(`${API_BASE}/admin/login?username=${username}&password=${password}`, {
      method: "POST"
    });
    const data = await res.json();
    
    if (res.ok) {
      authToken = data.token;
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("uploadSection").style.display = "block";
      document.getElementById("docListSection").style.display = "block";
      document.getElementById("byokSection").style.display = "block";
      loadDocuments();
    } else {
      alert(UI_TEXT.loginFailed + (data.detail || "Check username and password"));
    }
  } catch (err) {
    alert(UI_TEXT.connectionFailed);
  }
}

async function uploadDocument() {
  const fileInput = document.getElementById("documentFile");
  const file = fileInput.files[0];
  if (!file) {
    showMessage("uploadMessage", UI_TEXT.noFileSelected, "error");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/admin/documents/upload`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${authToken}`
      },
      body: formData
    });
    const data = await res.json();
    
    if (res.ok) {
      showMessage("uploadMessage", data.message || UI_TEXT.uploadSuccess, "success");
      fileInput.value = "";
      loadDocuments();
    } else {
      showMessage("uploadMessage", data.detail || UI_TEXT.uploadFailed, "error");
    }
  } catch (err) {
    showMessage("uploadMessage", UI_TEXT.connectionFailed, "error");
  }
}

async function loadDocuments() {
  try {
    const res = await fetch(`${API_BASE}/admin/documents/count`, {
      headers: { "Authorization": `Bearer ${authToken}` }
    });
    const data = await res.json();
    
    const list = document.getElementById("docList");
    list.innerHTML = "";
    
    if (data.count === 0) {
      list.innerHTML = "<li>No documents yet</li>";
      return;
    }

    const li = document.createElement("li");
    li.textContent = `Total: ${data.count} document(s) stored`;
    list.appendChild(li);
  } catch (err) {
    console.error("Failed to load documents:", err);
  }
}

async function clearDocuments() {
  if (!confirm(UI_TEXT.confirmDelete)) return;
  
  try {
    const res = await fetch(`${API_BASE}/admin/documents/clear`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${authToken}` }
    });
    const data = await res.json();
    
    if (res.ok) {
      alert(data.message || UI_TEXT.clearSuccess);
      loadDocuments();
    }
  } catch (err) {
    alert(UI_TEXT.uploadFailed);
  }
}

async function saveByokConfig() {
  const provider = document.getElementById("llmProvider").value;
  const apiKey = document.getElementById("llmApiKey").value;
  if (!apiKey) {
    showMessage("byokMessage", "API key cannot be empty", "error");
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/admin/byok`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${authToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ llm_provider: provider, llm_api_key: apiKey })
    });
    if (res.ok) {
      showMessage("byokMessage", "Configuration saved successfully", "success");
    } else {
      const data = await res.json();
      showMessage("byokMessage", data.detail || "Save failed", "error");
    }
  } catch (err) {
    showMessage("byokMessage", "Connection error", "error");
  }
}
</script>
</body>
</html>
